#kubectl create secret generic redis-auth --from-literal=password='VoteVibe@Redis2026!' -n result

apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: result
type: Opaque
data:
  password: Vm90ZVZpYmVAUmVkaXMyMDI2IQ==
---  
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-code
  namespace: result
data:
  app.py: "import os\nimport redis\nfrom flask import Flask, render_template_string,\
    \ jsonify\napp = Flask(__name__)\ndef client(): return redis.Redis(host=os.environ['REDIS_HOST'],\
    \ port=6379, password=os.environ['REDIS_PASSWORD'], socket_connect_timeout=2,\
    \ socket_timeout=2, decode_responses=True)\nHTML = \"\"\"<!doctype html><html><head><meta\
    \ http-equiv=refresh content=3><meta name=viewport content='width=device-width,initial-scale=1'><title>VoteVibe\
    \ Results</title><style>body{background:#111827;color:white;font-family:sans-serif;text-align:center;padding:10vh\
    \ 10px}.cards{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}.card{padding:35px;min-width:180px;border-radius:18px}.blue{background:#163b83}.red{background:#8a1824}strong{font-size:5em}</style></head><body><h1>VoteVibe\
    \ Live Results</h1><p>Total votes: {{total}} | Refreshes every 3 seconds</p><div\
    \ class=cards><div class='card blue'><h2>BLUE</h2><strong>{{blue}}</strong><p>{{bp}}%</p></div><div\
    \ class='card red'><h2>RED</h2><strong>{{red}}</strong><p>{{rp}}%</p></div></div><p>Leader:\
    \ {{leader}}</p></body></html>\"\"\"\n@app.get('/')\ndef index():\n    try:\n\
    \        r=client(); blue,red=r.mget('blue_votes','red_votes'); blue=int(blue\
    \ or 0); red=int(red or 0)\n    except redis.RedisError: return 'Results unavailable:\
    \ Redis connection failed',503\n    total=blue+red\n    return render_template_string(HTML,blue=blue,red=red,total=total,bp=round(100*blue/total,1)\
    \ if total else 0,rp=round(100*red/total,1) if total else 0,leader='Blue' if blue>red\
    \ else 'Red' if red>blue else 'Tie')\n@app.get('/healthz')\ndef healthz(): return\
    \ jsonify(status='alive')\n@app.get('/readyz')\ndef readyz():\n    try: client().ping();\
    \ return jsonify(status='ready')\n    except redis.RedisError: return jsonify(status='redis\
    \ unavailable'),503\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: result
data:
  REDIS_HOST: redis-service.redis.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-app
  namespace: result
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: result-app
  template:
    metadata:
      labels:
        app: result-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - pip install --no-cache-dir --disable-pip-version-check --target /tmp/python
          flask==3.1.1 redis==6.2.0 gunicorn==23.0.0 && PYTHONPATH=/tmp/python exec
          /tmp/python/bin/gunicorn --bind 0.0.0.0:5000 --workers 2 --access-logfile
          - app:app
        workingDir: /app
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-auth
              key: password
        ports:
        - name: http
          containerPort: 5000
        resources:
          requests:
            cpu: 75m
            memory: 128Mi
          limits:
            cpu: 400m
            memory: 384Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: code
        configMap:
          name: app-code
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: result-service
  namespace: result
spec:
  type: NodePort
  selector:
    app: result-app
  ports:
  - name: http
    port: 80
    targetPort: 5000
    nodePort: 30003

