  namespace: redis
spec:
  podSelector:
    matchLabels:
      app: votevibe-redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: blue
      podSelector:
        matchLabels:
          app: blue-app
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: red
      podSelector:
        matchLabels:
          app: red-app
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: result
